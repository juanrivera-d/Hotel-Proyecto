<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hotel Leyton - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&display=swap');
    :root { --ink: #182530; --gold: #b68a35; --parchment: #f6f2e8; --paper: #ffffff; --slate: #32424b; --border: #e3dac5; }
    body { background-color: var(--parchment); color: var(--slate); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-login { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .brand-title { font-family: 'Fraunces', serif; color: var(--ink); font-size: 2.2rem; text-align: center; }
    .btn-gold { background-color: var(--gold); color: #fff; font-weight: 600; border: none; }
    .btn-gold:hover { background-color: #967027; color: #fff; }
    .dropdown-menu .dropdown-item { color: #182530 !important; } 
    .dropdown-menu .dropdown-item:hover { background-color: var(--gold-light, #f4ead3) !important; color: var(--ink, #182530) !important; }
  </style>
</head>
<body>
  <div class="card-login p-4 my-4">
    <div class="text-center mb-4">
      <h1 class="brand-title">Hotel <span style="font-style: italic; color:var(--gold);">Leyton</span></h1>
      <p class="text-muted small mb-0">Ingrese sus credenciales para acceder al sistema</p>
    </div>

    <div id="alerta" class="alert d-none small text-center"></div>

    <form id="formLogin" onsubmit="procesarLogin(event)">
      <div class="mb-3">
        <label for="documento" class="form-label fw-bold small">Número de Documento</label>
        <input type="text" id="documento" class="form-control" placeholder="Ej. 100101" required />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-bold small">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-gold w-100 py-2 mb-3 fw-bold">Iniciar Sesión</button>
    </form>

    <div class="text-center border-top pt-3">
      <small class="text-muted">¿No tienes una cuenta?</small><br>
      <a href="registro.html" class="fw-bold text-decoration-none" style="color:var(--gold);">Crear una cuenta</a>
    </div>
  </div>

  <script>
    const API_LOGIN = 'http://192.168.100.3:3001/api/login';

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (token) { window.location.href = 'index.html'; }
    });

    async function procesarLogin(e) {
      e.preventDefault();
      const documento = document.getElementById('documento').value.trim();
      const password = document.getElementById('password').value;
      const alerta = document.getElementById('alerta');

      alerta.classList.add('d-none');

      try {
        const res = await axios.post(API_LOGIN, { documento, password });
        
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('usuario', JSON.stringify(res.data.usuario));

        alerta.className = 'alert alert-success small text-center';
        alerta.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
        alerta.classList.remove('d-none');

        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } catch (err) {
        console.error('Error de Login:', err);
        alerta.className = 'alert alert-danger small text-center';
        alerta.textContent = err.response?.data?.mensaje || 'Documento o contraseña incorrectos';
        alerta.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
