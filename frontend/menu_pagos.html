<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portal de Pagos - Hotel Leyton</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&display=swap');
    :root { --ink: #182530; --gold: #b68a35; --parchment: #f6f2e8; --paper: #ffffff; --slate: #32424b; --border: #e3dac5; }
    body { background-color: var(--parchment); color: var(--slate); font-family: 'Inter', sans-serif; }
    .navbar { background-color: var(--ink) !important; border-bottom: 3px solid var(--gold); }
    .navbar-brand { font-family: 'Fraunces', serif; font-size: 1.5rem; }
    .section-title { font-family: 'Fraunces', serif; font-weight: bold; color: var(--ink); }
    .title-underline { width: 60px; height: 3px; background-color: var(--gold); margin-bottom: 25px; }
    .btn-gold { background-color: var(--gold); color: #fff; font-weight: 600; border: none; }
    .btn-gold:hover { background-color: #967027; color: #fff; }
    .btn-admin-panel { background-color: transparent; color: var(--gold) !important; border: 1px solid var(--gold); font-weight: 700; }
    .btn-admin-panel:hover { background-color: var(--gold); color: #fff !important; }

    .action-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 24px; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 20px; transition: transform 0.2s, box-shadow 0.2s; }
    .action-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); color: inherit; }
    .action-icon { width: 50px; height: 50px; background-color: var(--parchment); color: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .dropdown-menu .dropdown-item { color: #182530 !important; } 
    .dropdown-menu .dropdown-item:hover { background-color: var(--gold-light, #f4ead3) !important; color: var(--ink, #182530) !important; }
  </style>
</head>
<body>

  <!-- NAVBAR UNIFICADO -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><span style="color:#fff;">Hotel</span> <span style="color:var(--gold); font-style: italic;">Leyton</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-2" id="menu-navegacion"></ul>
      </div>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 800px;">
    <h2 class="section-title h3 mb-1">Portal del Huésped · Pagos</h2>
    <div class="title-underline"></div>
    <p class="text-muted mb-4">Bienvenido. Gestiona el abono de tu reserva o consulta tus comprobantes de pago.</p>

    <div class="row g-4">
      <div class="col-md-6">
        <a class="action-card h-100" id="link-insertar" href="insertar_pago.html">
          <div class="action-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          </div>
          <div>
            <h5 class="fw-bold mb-1">Realizar Abono / Pago</h5>
            <p class="text-muted small mb-0">Registra un pago asociado a tu reserva.</p>
          </div>
        </a>
      </div>

      <div class="col-md-6">
        <a class="action-card h-100" href="consultar_pago.html">
          <div class="action-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </div>
          <div>
            <h5 class="fw-bold mb-1">Consultar Comprobante</h5>
            <p class="text-muted small mb-0">Revisa el estado de tu pago por ID.</p>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const usuarioSesion = JSON.parse(localStorage.getItem('usuario') || '{}');

    if (!token || !usuarioSesion.documento) { window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarNavegacion();
      
      // Preservar parámetros de reserva en la navegación si vienen desde Mis Reservas
      const params = new URLSearchParams(window.location.search);
      const idRes = params.get('idReserva');
      const monto = params.get('monto');
      if (idRes) {
        document.getElementById('link-insertar').href = `insertar_pago.html?idReserva=${idRes}&monto=${monto || ''}`;
      }
    });

    function renderizarNavegacion() {
      const esAdmin = usuarioSesion.rol && ['admin', 'administrador'].includes(usuarioSesion.rol.toLowerCase());
      const menu = document.getElementById('menu-navegacion');
      if (esAdmin) {
        menu.innerHTML = '<li class="nav-item dropdown">' +
            '<a class="nav-link dropdown-toggle active fw-semibold" href="#" role="button" data-bs-toggle="dropdown">Vista Cliente</a>' +
            '<ul class="dropdown-menu shadow">' +
              '<li><a class="dropdown-item" href="index.html">Inicio</a></li>' +
              '<li><a class="dropdown-item" href="ver_habitaciones.html">Catálogo</a></li>' +
              '<li><a class="dropdown-item" href="ver_servicios.html">Servicios</a></li>' +
              '<li><a class="dropdown-item" href="disponibilidad.html">Disponibilidad</a></li>' +
              '<li><a class="dropdown-item active" href="menu_pagos.html">Pagos</a></li>' +
              '<li><a class="dropdown-item" href="ver_reservas.html">Mis Reservas</a></li>' +
            '</ul>' +
          '</li>' +
          '<li class="nav-item dropdown">' +
            '<button class="btn btn-sm btn-admin-panel dropdown-toggle px-3 py-1" type="button" data-bs-toggle="dropdown">Administración ⚙️</button>' +
            '<ul class="dropdown-menu shadow">' +
              '<li><a class="dropdown-item fw-bold text-dark" href="gestion-reservas.html">Gestión de Reservas</a></li>' +
              '<li><a class="dropdown-item fw-bold text-dark" href="editar_habitacion.html">Gestión de Habitaciones</a></li>' +
              '<li><a class="dropdown-item fw-bold text-dark" href="editar_servicios.html">Gestión de Servicios</a></li>' +
              '<li><a class="dropdown-item fw-bold text-dark" href="editar_pagos.html">Gestión de Pagos</a></li>' +
              '<li><hr class="dropdown-divider"></li>' +
              '<li><a class="dropdown-item fw-bold text-primary" href="usuarios.html">Gestión de Usuarios</a></li>' +
            '</ul>' +
          '</li>' +
          '<li class="nav-item ms-lg-2" id="zona-usuario"></li>';
      } else {
        menu.innerHTML = '<li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>' +
          '<li class="nav-item"><a class="nav-link" href="ver_habitaciones.html">Catálogo</a></li>' +
          '<li class="nav-item"><a class="nav-link" href="ver_servicios.html">Servicios</a></li>' +
          '<li class="nav-item"><a class="nav-link" href="disponibilidad.html">Disponibilidad</a></li>' +
          '<li class="nav-item"><a class="nav-link active" href="menu_pagos.html">Pagos</a></li>' +
          '<li class="nav-item"><a class="nav-link" href="ver_reservas.html">Mis Reservas</a></li>' +
          '<li class="nav-item ms-lg-2" id="zona-usuario"></li>';
      }

      const primerNombre = (usuarioSesion.nombre || usuarioSesion.nombreCompleto || 'Usuario').split(' ')[0];
      document.getElementById('zona-usuario').innerHTML = '<div class="dropdown">' +
          '<button class="btn btn-gold btn-sm dropdown-toggle fw-bold px-3 py-1" type="button" data-bs-toggle="dropdown">' + primerNombre + (esAdmin ? ' <span class="badge bg-danger ms-1">Admin</span>' : '') + '</button>' +
          '<ul class="dropdown-menu dropdown-menu-end shadow">' +
            '<li><a class="dropdown-item fw-bold" href="configuracion.html">Configuración</a></li>' +
            '<li><hr class="dropdown-divider"></li>' +
            '<li><button class="dropdown-item text-danger fw-bold" onclick="cerrarSesion()">Cerrar Sesión</button></li>' +
          '</ul>' +
        '</div>';
    }

    function cerrarSesion() {
      if (confirm('¿Deseas cerrar tu sesión?')) {
        localStorage.clear();
        window.location.href = 'login.html';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
