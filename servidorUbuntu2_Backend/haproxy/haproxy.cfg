global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http-in
    bind *:80

    stats enable
    stats uri /haproxy?stats
    stats auth admin:admin
    stats refresh 5s

    acl url_usuarios     path_beg /api/usuarios /api/login /api/perfil
    acl url_habitaciones path_beg /api/habitaciones
    acl url_servicios    path_beg /api/servicios
    acl url_reservas     path_beg /api/reservas
    acl url_pagos        path_beg /api/pagos

    use_backend usuarios-backend     if url_usuarios
    use_backend habitaciones-backend if url_habitaciones
    use_backend servicios-backend    if url_servicios
    use_backend reservas-backend     if url_reservas
    use_backend pagos-backend        if url_pagos

    default_backend frontend-backend

backend frontend-backend
    balance roundrobin
    server apache_service hotel_frontend-apache:80 check

backend usuarios-backend
    balance roundrobin
    server usuarios_service hotel_backend-usuarios:3001 check

backend habitaciones-backend
    balance roundrobin
    server habitaciones_service hotel_backend-habitaciones:3002 check

backend servicios-backend
    balance roundrobin
    server servicios_service hotel_backend-servicios:3000 check

backend reservas-backend
    balance roundrobin
    server reservas_service hotel_backend-reservas:3003 check

backend pagos-backend
    balance roundrobin
    server pagos_service hotel_backend-pagos:3004 check
