global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 10000ms
    timeout client 120000ms
    timeout server 120000ms

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

frontend http-in
    bind *:80

    stats enable

    # CORS para el Dashboard Analitico (acepta entrada directa y via puerto 5080)
    acl origen_frontend req.hdr(Origin) -i http://192.168.100.2 http://192.168.100.3:5080 http://hotelleyton.com http://www.hotelleyton.com http://hotelleyton.com:5080
    acl ruta_analytics path_beg /api/analytics
    acl metodo_options method OPTIONS

    # Guardar si la solicitud viene del frontend autorizado
    http-request set-var(txn.cors_permitido) bool(true) if origen_frontend ruta_analytics
    http-request set-var(txn.cors_origin) req.hdr(Origin) if origen_frontend ruta_analytics

    # Responder solicitudes preflight OPTIONS
    http-request return status 204 hdr Access-Control-Allow-Origin "%[req.hdr(Origin)]" hdr Access-Control-Allow-Methods "GET, OPTIONS" hdr Access-Control-Allow-Headers "Authorization, Content-Type, Accept" hdr Access-Control-Max-Age "600" hdr Vary "Origin" if origen_frontend ruta_analytics metodo_options

    # Agregar CORS a las respuestas normales
    http-response set-header Access-Control-Allow-Origin "%[var(txn.cors_origin)]" if { var(txn.cors_permitido) -m bool }
    http-response set-header Vary "Origin" if { var(txn.cors_permitido) -m bool }

    stats uri /haproxy?stats
    stats auth admin:admin
    stats refresh 5s

    acl url_usuarios     path_beg /api/usuarios /api/login /api/perfil
    acl url_habitaciones path_beg /api/habitaciones
    acl url_servicios    path_beg /api/servicios
    acl url_reservas     path_beg /api/reservas
    acl url_pagos        path_beg /api/pagos
    acl url_analytics    path_beg /api/analytics

    use_backend usuarios-backend     if url_usuarios
    use_backend habitaciones-backend if url_habitaciones
    use_backend servicios-backend    if url_servicios
    use_backend reservas-backend     if url_reservas
    use_backend pagos-backend        if url_pagos
    use_backend analitica-backend    if url_analytics

    default_backend frontend-backend

backend frontend-backend
    balance roundrobin
    server-template apache- 5 tasks.hotel_frontend-apache:80 check resolvers docker init-addr none

backend usuarios-backend
    balance roundrobin
    server-template usuarios- 5 tasks.hotel_backend-usuarios:3001 check resolvers docker init-addr none

backend habitaciones-backend
    balance roundrobin
    server-template habitaciones- 5 tasks.hotel_backend-habitaciones:3002 check resolvers docker init-addr none

backend servicios-backend
    balance roundrobin
    server-template servicios- 5 tasks.hotel_backend-servicios:3000 check resolvers docker init-addr none

backend reservas-backend
    balance roundrobin
    server-template reservas- 5 tasks.hotel_backend-reservas:3003 check resolvers docker init-addr none

backend pagos-backend
    balance roundrobin
    server-template pagos- 5 tasks.hotel_backend-pagos:3004 check resolvers docker init-addr none

backend analitica-backend
    balance roundrobin
    server-template analitica- 5 tasks.hotel_backend-analitica:3005 check resolvers docker init-addr none
